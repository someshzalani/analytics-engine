version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: system-design-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: somesh123
      POSTGRES_DB: analytics_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  cache:
    image: redis:7-alpine
    container_name: system-design-cache
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M

  app:
    build: .
    container_name: system-design-app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - cache
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/analytics_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=somesh123
      - SPRING_DATA_REDIS_HOST=cache
      - SPRING_DATA_REDIS_PORT=6379
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M

volumes:
  postgres-data: