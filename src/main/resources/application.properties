spring.application.name=analytics-engine
# Server Port
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/analytics_db
spring.datasource.username=postgres
spring.datasource.password=somesh123
# Hibernate DDL generation strategy for safety
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool Optimization (Tight constraints for 1GB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Redis Configuration
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
